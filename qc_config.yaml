# Thresholds for qc_report.py -- ITS workflow.
#
# Bump config_version whenever a threshold changes: it is written into every
# output (per_sample_qc.tsv header, run_qc.txt) so a report can always be
# traced back to the thresholds that produced it.
#
# PROVISIONAL. These thresholds were carried over from the 16S config (v2.2)
# or picked from the expected ITS length profile; none has been calibrated on
# ITS data yet. Calibrate them on past ITS runs including fungal mock /
# positive controls -- NOT on ZymoBIOMICS D6305, which is a bacterial 16S
# standard and says nothing about ITS amplification. Treat every flag as a
# prompt to look, not a verdict, until then.
#
# Read quality is not flagged: every delivered read already passed MinKNOW
# Q15. The Q histogram is still shown, and median_q reported, for
# information only.
#
# ITS-specific choices:
#   * modal_dev_bp is info_only. ITS length legitimately varies with the
#     fungal community (ITS1/ITS2 length differs by taxon), so a sample whose
#     modal length is far from the run median is not by itself a failure.
#   * core_window is wide and below 1 kb; see the note at core_window.

config_version: 1.0-its

assay: ITS                    # used in the report title / headers
title: ITS QC report

filter:                       # informational; must mirror production
  minknow_min_len: 400        # MinKNOW drops shorter reads from fastq_pass on
                              # ITS runs; same as Chopper min_length, so in
                              # post mode Chopper only removes long reads
  minknow_min_q: 15           # MinKNOW pass Q
  chopper_max_len: 1200       # Chopper --maxlength (run_script.qsub
                              # max_length); longer reads are dropped

# Core amplicon window for core_frac, in bp, half-open [min, max). Both ends
# must be multiples of the 50 bp demux_qc bin width and lie inside
# minknow_min_len..chopper_max_len.
#
# PROVISIONAL: set from the expected ITS1F/ITS4 profile (main peak
# ~0.78-0.80 kb, shoulder ~0.60-0.70 kb), wide enough to keep both. Confirm
# against the demux_qc/<SampleID>.tsv length histograms of a real ITS run
# before relying on core_frac, and narrow it if the observed profile allows.
core_window: {min: 450, max: 1000}

# Length axis of the heatmaps and drill-down, in bp (multiples of 50). Must
# start at or below minknow_min_len and end above chopper_max_len so the
# long_frac tail is visible. Reads outside are clamped into the end bins.
plot: {len_min: 400, len_max: 2000}

# Below this many raw demultiplexed reads, every metric except
# delivered_reads is NA (n<N).
min_reads_for_stats: 200

# check/fail are absolute thresholds. higher_better: below check -> Check,
# below fail -> Fail. lower_better: above check -> Check, above fail -> Fail.
# Fractions are 0-1.
#
# absolute_only: never switched to relative (MAD) mode, even when the run
# median is bad. delivered_reads: 15,000 is a deliverable floor, not a
# run-relative judgement.
#
# info_only: reported (TSV, HTML, run medians) but never flagged and never
# raises a run flag. check/fail are not needed and are ignored if given.
metrics:
  delivered_reads: {direction: higher_better, check: 15000, fail: 5000, absolute_only: true}
  primer_found:    {direction: higher_better, check: 0.90, fail: 0.75}
  long_frac:       {direction: lower_better,  check: 0.05, fail: 0.15}
  core_frac:       {direction: higher_better, check: 0.75, fail: 0.50}
  modal_dev_bp:    {direction: lower_better,  info_only: true}

run_level:
  outlier_k_check: 3          # robust z >= 3 in the bad direction -> Check
  outlier_k_fail: 5           # robust z >= 5 in the bad direction -> Fail
  mad_floor: 0.02             # floor on the scaled MAD, in fraction units
  min_samples: 8              # fewer real samples than this: stay absolute

controls:
  types: [NTC, BLANK, POS_CTRL]
